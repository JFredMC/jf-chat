<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>JfChat</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="JfChat: chat en tiempo real con amigos, presencia, indicador de escritura y confirmaciones de lectura." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the saved theme before the first paint (no flash).
      (function () {
        try {
          var saved = localStorage.getItem('jfchat.theme');
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>JfChat necesita JavaScript para funcionar.</noscript>
  </body>
</html>
