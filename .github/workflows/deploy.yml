name: Deploy to GitHub Pages

# Publishes https://jfredmc.github.io/jf-chat/ on every push to main.
#
# Repository variable PAGES_MODE (Settings → Secrets and variables → Actions):
#   demo (default) → the demo (in-browser backend, no server) at the root.
#   api            → the real app (jf-chat-be API) at the root and the demo
#                    under /jf-chat/demo/. Switch only after the new API is
#                    deployed (see jf-chat-be/docs/DESPLIEGUE.md).

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES_MODE: ${{ vars.PAGES_MODE || 'demo' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint and unit tests
        run: yarn lint && yarn test

      - name: Build for GitHub Pages (${{ env.PAGES_MODE }})
        run: yarn build:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist/pages

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
